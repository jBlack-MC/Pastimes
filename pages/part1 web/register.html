<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>ShopSphere · Sign Up</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f8f6f2;
      --white: #ffffff;
      --text: #1a2a2a;
      --text-light: #5a6e6e;
      --green: #2a6b5e;
      --green-dark: #1e5247;
      --rust: #c26743;
      --gold: #d4a259;
      --border: #e2e0db;
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(0, 0, 0, 0.02);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* card container */
    .register-card {
      max-width: 480px;
      width: 100%;
      background: var(--white);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 2rem 1.8rem 2.2rem;
      transition: all 0.2s;
    }

    /* header */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.5rem;
      justify-content: center;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--green), #3a8a7a);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.4rem;
    }

    .logo-text {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--green);
    }

    .badge {
      background: #eef3f1;
      color: var(--green);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 30px;
      margin-left: 8px;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: var(--text);
    }

    .sub {
      color: var(--text-light);
      font-size: 0.9rem;
      margin-bottom: 1.8rem;
      border-left: 3px solid var(--gold);
      padding-left: 12px;
    }

    /* form */
    .input-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text);
    }

    label i {
      margin-right: 6px;
      color: var(--green);
      font-size: 0.75rem;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(42, 107, 94, 0.08);
    }

    .name-row {
      display: flex;
      gap: 12px;
    }

    .name-row .input-group {
      flex: 1;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 1.2rem 0 1.4rem;
    }

    .checkbox input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--green);
    }

    .checkbox label {
      margin: 0;
      font-size: 0.8rem;
      color: var(--text-light);
    }

    .checkbox a {
      color: var(--green);
      text-decoration: none;
      font-weight: 500;
    }

    button {
      width: 100%;
      background: var(--green);
      color: white;
      border: none;
      padding: 13px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover {
      background: var(--green-dark);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 1.5rem 0 1rem;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      font-size: 0.7rem;
      color: var(--text-light);
    }

    .social {
      display: flex;
      gap: 12px;
    }

    .social-btn {
      flex: 1;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 40px;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .social-btn:hover {
      background: #f7f5f0;
      border-color: var(--gold);
    }

    .login-link {
      text-align: center;
      margin-top: 1.6rem;
      font-size: 0.85rem;
      color: var(--text-light);
    }

    .login-link a {
      color: var(--rust);
      font-weight: 600;
      text-decoration: none;
    }

    /* simple note */
    .secure-note {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.7rem;
      color: var(--text-light);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    hr {
      margin: 1rem 0;
      border: none;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 500px) {
      .register-card {
        padding: 1.5rem;
      }
      .name-row {
        flex-direction: column;
        gap: 0;
      }
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
<div class="register-card">
  <!-- logo area -->
  <div class="logo">
    <div class="logo-icon">
      <i class="fas fa-vest"></i>
    </div>
    <div>
      <span class="logo-text">ShopSphere</span>
      <span class="badge">local fashion</span>
    </div>
  </div>

  <h1>Create account</h1>
  <div class="sub">Join our community of local shoppers</div>

  <!-- registration form -->
  <form id="regForm">
    <div class="name-row">
      <div class="input-group">
        <label><i class="fas fa-user"></i> First name</label>
        <input type="text" id="firstName" placeholder="Alex" required>
      </div>
      <div class="input-group">
        <label><i class="fas fa-user-friends"></i> Last name</label>
        <input type="text" id="lastName" placeholder="Morgan" required>
      </div>
    </div>

    <div class="input-group">
      <label><i class="fas fa-envelope"></i> Email</label>
      <input type="email" id="email" placeholder="hello@example.com" required>
    </div>

    <div class="input-group">
      <label><i class="fas fa-lock"></i> Password</label>
      <input type="password" id="password" placeholder="At least 6 characters" required>
    </div>

    <div class="input-group">
      <label><i class="fas fa-check"></i> Confirm password</label>
      <input type="password" id="confirmPwd" placeholder="Confirm your password" required>
    </div>

    <div class="checkbox">
      <input type="checkbox" id="terms" required>
      <label>I agree to the <a href="#">Terms</a> and <a href="#">Privacy policy</a></label>
    </div>

    <div class="checkbox">
      <input type="checkbox" id="offers" checked>
      <label>Send me style updates & local offers</label>
    </div>

    <button type="submit"><i class="fas fa-user-plus"></i> Sign up for free</button>

    <div class="divider">
      <div class="divider-line"></div>
      <span>or</span>
      <div class="divider-line"></div>
    </div>

    <div class="social">
      <button type="button" class="social-btn" id="googleSignup"><i class="fab fa-google"></i> Google</button>
      <button type="button" class="social-btn" id="appleSignup"><i class="fab fa-apple"></i> Apple</button>
    </div>

    <div class="login-link">
      Already have an account? <a href="#">Log in →</a>
    </div>

    <hr>

    <div class="secure-note">
      <i class="fas fa-shield-alt" style="color: var(--green);"></i> Secure & encrypted
      <i class="fas fa-lock" style="color: var(--green);"></i> Buyer protection
    </div>
  </form>
</div>

<!-- simple form validation -->
<script>
  (function() {
    const form = document.getElementById('regForm');
    
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPwd = document.getElementById('confirmPwd').value;
      const termsChecked = document.getElementById('terms').checked;
      
      let errors = [];
      
      if (!firstName) errors.push('First name is required');
      if (!lastName) errors.push('Last name is required');
      if (!email) errors.push('Email address is required');
      else if (!email.includes('@') || !email.includes('.')) errors.push('Enter a valid email');
      if (!password) errors.push('Password is required');
      else if (password.length < 6) errors.push('Password must be at least 6 characters');
      if (password !== confirmPwd) errors.push('Passwords do not match');
      if (!termsChecked) errors.push('You must agree to the Terms');
      
      if (errors.length > 0) {
        alert('Please fix:\n• ' + errors.join('\n• '));
      } else {
        alert('✨ Welcome to ShopSphere! Your account has been created.\n🎁 Check your email for 10% welcome discount.');
        form.reset();
        document.getElementById('offers').checked = true;
      }
    });
    
    // social demo
    document.getElementById('googleSignup')?.addEventListener('click', () => alert('Google sign-up (demo) — would connect to OAuth.'));
    document.getElementById('appleSignup')?.addEventListener('click', () => alert('Apple sign-up (demo) — secure authentication.'));
    
    // demo login link
    const loginLink = document.querySelector('.login-link a');
    if (loginLink) {
      loginLink.addEventListener('click', (e) => {
        e.preventDefault();
        alert('🔐 Login page demo — returning users can sign in.');
      });
    }
  })();
</script>
</body>
</html>

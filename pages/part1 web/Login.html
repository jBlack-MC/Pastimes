<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>ShopSphere · Sign in to your account</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-page: #f9f7f4;
      --white: #ffffff;
      --text-primary: #1e2a2a;
      --text-secondary: #5a6e6e;
      --text-muted: #8a9b9b;
      --green: #2a6b5e;
      --green-dark: #1e5247;
      --rust: #c26743;
      --gold: #d4a259;
      --border: #e8e6e1;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.06);
      --radius-lg: 28px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* login card */
    .login-container {
      max-width: 460px;
      width: 100%;
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      padding: 2rem 2rem 2.2rem;
      transition: all 0.2s;
    }

    /* header */
    .logo-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--green), #3a8a7a);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
    }

    .logo-text {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--green);
    }

    .badge {
      background: #eef3f1;
      color: var(--green);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 30px;
      margin-left: 8px;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 0.4rem;
      color: var(--text-primary);
    }

    .subtitle {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 1.8rem;
    }

    /* form */
    .input-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-primary);
    }

    label i {
      margin-right: 6px;
      color: var(--green);
      width: 18px;
    }

    .input-field {
      width: 100%;
      padding: 12px 16px;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
    }

    .input-field:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(42, 107, 94, 0.08);
    }

    /* password row with forgot */
    .password-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .forgot-link {
      font-size: 0.75rem;
      color: var(--rust);
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* checkbox */
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 1rem 0 1.2rem;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: var(--green);
      cursor: pointer;
    }

    .checkbox-group label {
      margin: 0;
      font-size: 0.8rem;
      font-weight: normal;
      color: var(--text-secondary);
    }

    /* login button */
    .login-btn {
      width: 100%;
      background: var(--green);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 6px;
    }

    .login-btn:hover {
      background: var(--green-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(42, 107, 94, 0.2);
    }

    /* divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 1.5rem 0 1rem;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* social buttons */
    .social-buttons {
      display: flex;
      gap: 12px;
    }

    .social-btn {
      flex: 1;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 60px;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .social-btn:hover {
      background: #f8f6f2;
      border-color: var(--gold);
    }

    /* register link */
    .register-link {
      text-align: center;
      margin-top: 1.6rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .register-link a {
      color: var(--green);
      font-weight: 700;
      text-decoration: none;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    /* error message */
    .error-message {
      background: #fef2e8;
      color: var(--rust);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      margin-bottom: 1rem;
      display: none;
      align-items: center;
      gap: 8px;
      border-left: 3px solid var(--rust);
    }

    .error-message.show {
      display: flex;
    }

    /* success demo toast */
    .demo-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--green);
      color: white;
      padding: 12px 24px;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }

    .demo-toast.show {
      opacity: 1;
    }

    /* secure footer */
    .secure-footer {
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .secure-footer i {
      color: var(--green);
    }

    @media (max-width: 500px) {
      .login-container {
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      .logo-text {
        font-size: 1.5rem;
      }
      .social-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
<div class="login-container">
  <!-- logo -->
  <div class="logo-area">
    <div class="logo-icon">
      <i class="fas fa-vest"></i>
    </div>
    <div>
      <span class="logo-text">ShopSphere</span>
      <span class="badge">local fashion</span>
    </div>
  </div>

  <h1>Welcome back</h1>
  <div class="subtitle">Sign in to your account</div>

  <!-- error message placeholder -->
  <div id="errorMsg" class="error-message">
    <i class="fas fa-exclamation-circle"></i>
    <span id="errorText"></span>
  </div>

  <!-- login form -->
  <form id="loginForm">
    <div class="input-group">
      <label><i class="fas fa-envelope"></i> Email address</label>
      <input type="email" id="email" class="input-field" placeholder="hello@shopsphere.com" value="demo@shopsphere.com" required>
    </div>

    <div class="input-group">
      <div class="password-row">
        <label><i class="fas fa-lock"></i> Password</label>
        <a href="#" class="forgot-link" id="forgotPasswordLink">Forgot password?</a>
      </div>
      <input type="password" id="password" class="input-field" placeholder="Enter your password" value="demo123" required>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="rememberMe">
      <label for="rememberMe">Remember me</label>
    </div>

    <button type="submit" class="login-btn">
      <i class="fas fa-arrow-right-to-bracket"></i> Sign in
    </button>
  </form>

  <div class="divider">
    <div class="divider-line"></div>
    <span>or continue with</span>
    <div class="divider-line"></div>
  </div>

  <div class="social-buttons">
    <button type="button" class="social-btn" id="googleLogin">
      <i class="fab fa-google"></i> Google
    </button>
    <button type="button" class="social-btn" id="appleLogin">
      <i class="fab fa-apple"></i> Apple
    </button>
  </div>

  <div class="register-link">
    Don't have an account? <a href="#" id="registerLink">Create account →</a>
  </div>

  <div class="secure-footer">
    <span><i class="fas fa-shield-alt"></i> Secure login</span>
    <span><i class="fas fa-lock"></i> Encrypted</span>
    <span><i class="fas fa-store"></i> 14k+ members</span>
  </div>
</div>

<!-- demo toast notification -->
<div id="demoToast" class="demo-toast"></div>

<script>
  (function() {
    const form = document.getElementById('loginForm');
    const errorMsgDiv = document.getElementById('errorMsg');
    const errorTextSpan = document.getElementById('errorText');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const rememberCheck = document.getElementById('rememberMe');
    const toast = document.getElementById('demoToast');

    function showError(message) {
      errorTextSpan.innerText = message;
      errorMsgDiv.classList.add('show');
      setTimeout(() => {
        errorMsgDiv.classList.remove('show');
      }, 3000);
    }

    function showToast(message, isSuccess = true) {
      toast.innerText = message;
      toast.style.background = isSuccess ? 'var(--green)' : 'var(--rust)';
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // demo credentials: any email with password length >= 4 will "succeed"
    // for demo: accept demo@shopsphere.com / demo123, or any email/password with length >=4
    function validateLogin(email, password) {
      if (!email || !password) return false;
      // simple demo logic: email must contain '@', password length >= 4
      if (email.includes('@') && password.length >= 4) {
        // special case: wrong password hint but we still accept for demo
        return true;
      }
      return false;
    }

    // handle login
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      
      if (!email) {
        showError('Please enter your email address.');
        return;
      }
      if (!email.includes('@')) {
        showError('Please enter a valid email address.');
        return;
      }
      if (!password) {
        showError('Please enter your password.');
        return;
      }
      if (password.length < 4) {
        showError('Password must be at least 4 characters.');
        return;
      }
      
      // demo authentication success
      if (validateLogin(email, password)) {
        // success: store login state in sessionStorage for demo
        if (rememberCheck.checked) {
          localStorage.setItem('shopsphere_remember', email);
        } else {
          sessionStorage.setItem('shopsphere_user', email);
        }
        
        showToast(`✅ Welcome back, ${email.split('@')[0]}! Redirecting to marketplace...`, true);
        
        // simulate redirect after 1.2s
        setTimeout(() => {
          // in a real app, redirect to dashboard / product listing
          alert('🎉 Login successful!\n\nYou now have access to ShopSphere marketplace.\n(Demo redirect would go to products page.)');
          // optional: reset form or clear sensitive fields
          // For demo we just show success; you could redirect to product listing page.
          // window.location.href = "products.html"; // uncomment in real integration
        }, 1000);
      } else {
        showError('Invalid email or password. Try demo@shopsphere.com / demo123');
      }
    });
    
    // Forgot password demo
    const forgotLink = document.getElementById('forgotPasswordLink');
    if (forgotLink) {
      forgotLink.addEventListener('click', function(e) {
        e.preventDefault();
        showToast('📧 Password reset link sent to your email (demo).', false);
      });
    }
    
    // Register link demo
    const registerLink = document.getElementById('registerLink');
    if (registerLink) {
      registerLink.addEventListener('click', function(e) {
        e.preventDefault();
        showToast('✨ Create a new account — redirect to registration page (demo).', false);
        alert('📝 Registration page would open here.\nJoin ShopSphere to start shopping local!');
      });
    }
    
    // Social login demos
    const googleBtn = document.getElementById('googleLogin');
    const appleBtn = document.getElementById('appleLogin');
    
    if (googleBtn) {
      googleBtn.addEventListener('click', function() {
        showToast('🔐 Google Sign-In (demo) — would authenticate via OAuth.', false);
        setTimeout(() => {
          alert('Google authentication demo: You would be logged in instantly.');
        }, 200);
      });
    }
    
    if (appleBtn) {
      appleBtn.addEventListener('click', function() {
        showToast('🍎 Apple Sign-In (demo) — secure authentication flow.', false);
        setTimeout(() => {
          alert('Apple ID login demo: seamless and private.');
        }, 200);
      });
    }
    
    // prefill demo credentials if any saved (simple)
    const savedEmail = localStorage.getItem('shopsphere_remember');
    if (savedEmail && !emailInput.value) {
      emailInput.value = savedEmail;
      rememberCheck.checked = true;
    }
    
    // small helper: clear demo data on page unload not needed
  })();
</script>
</body>
</html>
